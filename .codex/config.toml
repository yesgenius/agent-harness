# The agent takes a work order and runs for hours, stopping only on product
# questions, so commands run without a sandbox and without prompts. Irreversible
# commands are refused by .codex/rules/*.rules, the same list the other agent
# front-end denies. docs/specs/AGENT-FRONT-ENDS.md explains the trade-off.
#
# Top-level keys go ABOVE the first [table]: a key that lands inside a table
# keeps the TOML valid, so a parser shows nothing while the setting is wrong.
approval_policy = "never"
sandbox_mode = "danger-full-access"
web_search = "cached"
project_doc_max_bytes = 65536
project_doc_fallback_filenames = []
model_reasoning_effort = "high"
plan_mode_reasoning_effort = "high"

[features]
memories = false

[mcp_servers.chrome-devtools]
command = "npx"
args = [
  "-y",
  "chrome-devtools-mcp@1.9.0",
  "--pageIdRouting=true",
  "--no-usage-statistics",
  "--no-performance-crux"
]
startup_timeout_sec = 180
